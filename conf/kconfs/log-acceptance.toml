#! Focused KernelConfig for the native developer-log acceptance matrix.

[features]
kunit = true
fs_ext4 = true
kernel_preempt = false
spin_lock_irqsave = true
soft_unaligned_access = true
kernel_symbols = true

[parameters]
bootstrap_heap_shift_kb = 16
log_buffer_shift_kb = 9
log_record_shift_bytes = 9
print_log_level = 6
record_log_level = 7
kstack_shift_kb = 9
remap_shift_gb = 6
max_logical_cpus = 16
max_ident_len_bytes = 255
max_path_len_bytes = 4096
c_string_batch_bytes = 256
max_processes = 32768
epoll_file_max_waiters = 64
getdents64_buffer_bytes = 2097152
pipe_capacity_pages = 2
pipe_max_capacity_pages = 16
tid_alloc_policy = "oneshot"
system_hz = 100
sched_default_policy = "fair"
rt_rr_timeslice_ms = 100
backtrace_depth = 16
user_stack_shift_kb = 13
user_init_stack_shift_kb = 4
user_heap_shift_mb = 12
shmmax_bytes = 9223372036837998591
shmall_pages = 9223372036837998591
shmmni = 4096
io_shrink_threshold = 50
oom_kill_threshold = 90
symlink_resolve_limit = 16
max_fd_per_process = 1024
initial_umask = 18
ramdisk_count = 16
loop_device_count = 8
ns16550a_default_baud = 115200
ns16550a_fallback_clock_hz = 24000000
tty_raw_rx_capacity_bytes = 4096
tty_canonical_line_capacity_bytes = 4096
tty_input_capacity_bytes = 4096
tty_output_capacity_bytes = 4096
tty_worker_batch_bytes = 256
ns16550a_irq_rx_budget_bytes = 256
ns16550a_tx_batch_bytes = 16
ns16550a_tx_poll_iterations = 65536
dw_mshc_poll_timeout_ms = 500
ahci_hba_reset_timeout_ms = 1000
ahci_engine_timeout_ms = 500
ahci_port_timeout_ms = 5000
ahci_command_timeout_ms = 30000
ahci_read_warn_ms = 100
ahci_read_timeout_ms = 10000
ahci_bounce_kb = 128
eevdf_base_slice_us = 3000
eevdf_wake_clamp_us = 3000
eevdf_yield_penalty_us = 3000
eevdf_anomaly_threshold = 8
virtio_net_queue_size = 64
virtio_net_frame_capacity_bytes = 2048
net_pump_ingress_budget_frames = 32
net_pump_egress_budget_steps = 32
net_worker_repoll_rounds = 8
net_local_link_packet_capacity = 64
net_local_link_mtu_bytes = 1500
net_udp_endpoint_capacity = 64
net_udp_tx_datagram_capacity = 8
net_udp_rx_datagram_capacity = 64
net_udp_error_record_capacity = 16
net_udp_max_payload_bytes = 1472
net_udp_ephemeral_port_first = 32768
net_udp_ephemeral_port_last = 60999
