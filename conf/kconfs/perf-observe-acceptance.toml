#! Focused KernelConfig for native performance observation acceptance.

[features]
kunit = true
fs_ext4 = true
kernel_preempt = false
spin_lock_irqsave = true
soft_unaligned_access = true
kernel_symbols = true
perf_observe = true

[parameters]
max_logical_cpus = 16
# The focused printk pilot records Debug callsites without printing them to the
# serial console; leaving the parameter at its production default makes its
# sample-count oracle vacuous.
record_log_level = 7
