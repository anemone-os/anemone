#! Template for anemone-apps/<app>/app.toml.
#!
#! This file is the contract between an app and Anemone's build orchestration.
#! xtask reads this manifest, enters the declared working directory, applies
#! the selected closed driver, and exports the declared artifacts.

# Stable logical app name used by rootfs manifests.
# This name must match the folder name of the app, e.g., anemone-apps/<app>.
name = "example"
# Closed app build targets supported by this manifest. Every app declares this
# list explicitly. `host` is app-local and is not a Platform architecture.
targets = ["riscv64", "loongarch64"]

[build]
# Working directory relative to this app.toml.
workdir = "."
# Build driver used by xtask. Cargo runs an architecture-specific Cargo command;
# Command runs a manifest-owned direct argv in workdir; Source runs no command
# and exports already-existing ordinary files.
# Currently supported drivers:
# - cargo (Anemone targets only; uses build-std and conf/arch target JSON)
# - command (replace args with a non-empty argv of at most 256 entries)
# - source (omit args; caller-provided extra args are rejected)
driver = "cargo"
# Cargo arguments. User-provided extra args are appended to these defaults.
args = ["build"]

# Command example (use instead of the Cargo driver/args above):
# driver = "command"
# argv = ["./build.sh"]
# xtask appends caller-provided extra args, executes argv directly without a
# shell, and sets the target context for this action. Anemone targets receive
# ANEMONE_ARCH / ANEMONE_TARGET_TRIPLE. For host, ANEMONE_ARCH is `host` and
# ANEMONE_TARGET_TRIPLE is removed because there is no Anemone compiler target.
# Toolchain selection and all other environment remain command-owned.

# List of artifacts produced by this app. Each artifact should have a unique name.
[[artifacts]]
# Path to the built artifact relative to workdir.
# Xtask will expand following variables in the path:
# - ${ARCH}: replaced by the app build target, e.g., "riscv64" or "host".
# - ${TARGET_TRIPLE}: replaced by the Anemone target triple, e.g.,
#   "riscv64-unknown-anemone-elf". Artifacts applicable to host cannot use it.
path = "target/${TARGET_TRIPLE}/debug/example"
# Optional non-empty subset of app targets that exports this artifact. Omit to
# export it for every declared app target. Every app target needs an artifact.
# targets = ["riscv64", "loongarch64"]
