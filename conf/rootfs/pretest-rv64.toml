[build]
name = "pretest-rv64"
arch = "riscv64"

[fs]
type = "folder"
fstype = "ext4"
base = "conf/rootfs/pretest-rv64-base"

[init]
path = "/sbin/init"

[[dirs]]
path = "/dev"

[[dirs]]
path = "/mnt"

[[dirs]]
path = "/proc"

[[apps]]
name = "init"
installed_dir = "/sbin"

