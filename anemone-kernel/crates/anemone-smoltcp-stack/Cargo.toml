[package]
name = "anemone-smoltcp-stack"
version = "0.1.0"
edition = "2024"

[features]
default = ["host-test"]
host-test = ["std"]
std = ["smoltcp/std"]

[dependencies]
anemone-net-api = { path = "../anemone-net-api" }
smoltcp = { path = "../anemos/smoltcp", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "medium-ip",
    "proto-ipv4",
    # Ordinary ICMP owns Echo Reply generation on both production interfaces
    # and host validation paths; keeping this host-test-only breaks loopback.
    "auto-icmp-echo-reply",
    # The Stack-private ICMP raw engine observes admitted IPv4 datagrams and
    # submits endpoint-owned egress through the normal smoltcp provider path.
    # This feature does not publish smoltcp's socket object outside the Stack.
    "socket-raw",
    "socket-tcp",
    "socket-udp",
] }

[[test]]
name = "frame_path"
path = "tests/frame_path.rs"
required-features = ["host-test"]

[[test]]
name = "bounded_progress"
path = "tests/bounded_progress.rs"
required-features = ["host-test"]

[[test]]
name = "multi_instance"
path = "tests/multi_instance.rs"
required-features = ["host-test"]

[[test]]
name = "multi_interface"
path = "tests/multi_interface.rs"
required-features = ["host-test"]

[[test]]
name = "udp_topology"
path = "tests/udp_topology/mod.rs"
required-features = ["host-test"]

[[test]]
name = "icmp_raw"
path = "tests/icmp_raw.rs"
required-features = ["host-test"]
