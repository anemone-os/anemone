[package]
name = "anemone-smoltcp-stack"
version = "0.1.0"
edition = "2024"

[features]
default = ["host-test"]
host-test = ["std", "smoltcp/auto-icmp-echo-reply"]
std = ["smoltcp/std"]

[dependencies]
anemone-net-api = { path = "../anemone-net-api" }
smoltcp = { path = "../anemos/smoltcp", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "proto-ipv4",
    # smoltcp 0.13 makes `medium-ethernet` enable its private socket enum and
    # rejects an empty variant set. Raw is only the compile anchor here: this
    # crate exposes and constructs no production endpoint. Remove this anchor
    # when smoltcp supports a socketless Ethernet interface or an accepted
    # production socket feature replaces it.
    "socket-raw",
] }

[[test]]
name = "frame_path"
path = "tests/frame_path.rs"
required-features = ["host-test"]
